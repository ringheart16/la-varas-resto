<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="La Vara's POS" />
    <meta name="format-detection" content="telephone=no" />
    <title>La Vara's Resto POS System</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        button,
        a,
        input,
        select {
            touch-action: manipulation;
        }

        @media print {
            body * {
                visibility: hidden !important;
            }

            #printable-receipt,
            #printable-receipt * {
                visibility: visible !important;
            }

            #printable-receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }

            .print-hidden {
                display: none !important;
            }
        }

        .product-image {
            transition: transform .3s;
        }

        .product-card:hover .product-image {
            transform: scale(1.04);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const API = 'api.php';
        const Logo = ({ className = "w-6 h-6" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-label="La Vara's Resto">
                <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
                <path d="M7 2v20" />
                <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
            </svg>
        );
        const LogoutIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
        );
        const money = n => '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const fmtDate = s => new Date(String(s).replace(' ', 'T')).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' });

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [cashier, setCashier] = useState(null);
            const [loginError, setLoginError] = useState('');
            const [authMode, setAuthMode] = useState('login');
            const [fullName, setFullName] = useState('');
            const [confirmPw, setConfirmPw] = useState('');
            const [showPw, setShowPw] = useState(false);
            const [authBusy, setAuthBusy] = useState(false);

            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState([]);
            const [page, setPage] = useState('pos');
            const [search, setSearch] = useState('');
            const [category, setCategory] = useState('All');
            const [payment, setPayment] = useState('Cash');
            const [customer, setCustomer] = useState('');
            const [cash, setCash] = useState('');
            const [reference, setReference] = useState('');
            const [mobileCartOpen, setMobileCartOpen] = useState(false);
            const [checkoutOpen, setCheckoutOpen] = useState(false);
            const [receipt, setReceipt] = useState(null);
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(false);

            const refreshProducts = async () => {
                try {
                    const r = await fetch(API + '?action=products');
                    const d = await r.json();
                    if (d.success) setProducts(d.products);
                } catch (e) { }
            };

            const setOrderStatus = async (code, status) => {
                try {
                    const r = await fetch(API + '?action=order_status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                        body: JSON.stringify({ order_code: code, status })
                    });
                    const d = await r.json();
                    if (!d.success) throw Error(d.message);
                    await refreshOrders();
                    await refreshProducts();
                } catch (e) {
                    alert(e.message);
                    refreshOrders();
                }
            };

            const refreshOrders = async () => {
                try {
                    const r = await fetch(API + '?action=orders');
                    const d = await r.json();
                    if (d.success) setHistory(d.orders);
                } catch (e) { }
            };

            useEffect(() => {
                if (isLoggedIn) {
                    refreshProducts();
                    refreshOrders();
                    const t = setInterval(() => {
                        refreshOrders();
                        refreshProducts();
                    }, 15000);
                    return () => clearInterval(t);
                }
            }, [isLoggedIn]);

            const authRequest = async (action, payload) => {
                let r;
                try {
                    r = await fetch(API + '?action=' + action, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    throw Error('Cannot reach the server. Please check your internet connection and try again.');
                }
                const t = await r.text();
                let d;
                try { d = JSON.parse(t); } catch (e) { throw Error('Server error. Please try again in a moment.'); }
                if (!d.success) throw Error(d.message || 'Request failed.');
                return d;
            };

            const login = async e => {
                e.preventDefault();
                setLoginError('');
                setAuthBusy(true);
                try {
                    const d = await authRequest('login', { username, password });
                    setCashier(d.cashier);
                    setIsLoggedIn(true);
                    setPassword('');
                } catch (err) {
                    setLoginError(err.message);
                } finally {
                    setAuthBusy(false);
                }
            };

            const register = async e => {
                e.preventDefault();
                setLoginError('');
                if (password !== confirmPw) { setLoginError('Passwords do not match.'); return; }
                setAuthBusy(true);
                try {
                    const d = await authRequest('register', { name: fullName, username, password });
                    setCashier(d.cashier);
                    setIsLoggedIn(true);
                    setPassword('');
                    setConfirmPw('');
                } catch (err) {
                    setLoginError(err.message);
                } finally {
                    setAuthBusy(false);
                }
            };

            const switchAuth = m => {
                setAuthMode(m);
                setLoginError('');
                setPassword('');
                setConfirmPw('');
                setShowPw(false);
            };

            const logout = () => {
                fetch(API + '?action=cashier_logout', { method: 'POST' }).catch(() => { });
                setIsLoggedIn(false);
                setCashier(null);
                setCart([]);
                setUsername('');
                setPassword('');
                setPage('pos');
                setAuthMode('login');
                setConfirmPw('');
                setFullName('');
                setMobileCartOpen(false);
                setCheckoutOpen(false);
            };

            const qty = id => cart.find(x => x.id == id)?.quantity || 0;

            const add = p => setCart(c => {
                const old = c.find(x => x.id == p.id);
                if (old) {
                    if (old.quantity >= Number(p.stock)) {
                        alert('No more stock available for ' + p.name + '.');
                        return c;
                    }
                    return c.map(x => x.id == p.id ? { ...x, quantity: x.quantity + 1 } : x);
                }
                return [...c, { ...p, quantity: 1 }];
            });

            const changeQty = (id, delta) => setCart(c => c.map(x => {
                if (x.id != id) return x;
                const maxStock = Number(products.find(p => p.id == id)?.stock || x.stock);
                return { ...x, quantity: Math.min(maxStock, x.quantity + delta) };
            }).filter(x => x.quantity > 0));

            const remove = id => setCart(c => c.filter(x => x.id != id));

            const subtotal = cart.reduce((s, x) => s + Number(x.price) * x.quantity, 0);
            const tax = Math.round(subtotal * 0.12 * 100) / 100;
            const total = Math.round((subtotal + tax) * 100) / 100;
            const change = Math.max(0, Math.round((Number(cash || 0) - total) * 100) / 100);

            const cats = ['All', ...new Set(products.map(p => p.category))];
            const filtered = products.filter(p => (category === 'All' || p.category === category) && p.name.toLowerCase().includes(search.toLowerCase()));

            const checkout = async () => {
                if (!cart.length) return;
                if (payment === 'Cash' && Number(cash || 0) < total) {
                    alert('Cash received is less than the total amount.');
                    return;
                }
                if (payment !== 'Cash' && !reference.trim()) {
                    alert('Please enter a ' + payment + ' payment reference number.');
                    return;
                }
                setLoading(true);
                try {
                    const r = await fetch(API + '?action=checkout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            cashier_id: cashier.id,
                            customer_name: customer.trim() || 'Walk-in Customer',
                            payment_method: payment,
                            cash_received: payment === 'Cash' ? cash : null,
                            payment_reference: reference.trim(),
                            items: cart.map(x => ({ id: x.id, quantity: x.quantity }))
                        })
                    });
                    const d = await r.json();
                    if (!d.success) throw Error(d.message);
                    setReceipt(d.order);
                    setCheckoutOpen(false);
                    setMobileCartOpen(false);
                    setCart([]);
                    setCustomer('');
                    setCash('');
                    setReference('');
                    await refreshProducts();
                    await refreshOrders();
                } catch (e) {
                    alert(e.message);
                } finally {
                    setLoading(false);
                }
            };

            const STATUS_BADGE = {
                Pending: 'bg-amber-100 text-amber-700',
                Processing: 'bg-blue-100 text-blue-700',
                Completed: 'bg-green-100 text-green-700',
                Cancelled: 'bg-red-100 text-red-600',
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
                        <div className="w-full max-w-md my-auto bg-white rounded-3xl shadow-2xl overflow-hidden">
                            <div className="bg-blue-700 p-6 sm:p-8 text-center text-white">
                                <div className="inline-flex bg-white/10 p-3 sm:p-4 rounded-2xl mb-2 sm:mb-3"><Logo className="w-8 h-8 sm:w-10 sm:h-10" /></div>
                                <h1 className="text-xl sm:text-2xl font-bold">La Vara's Resto</h1>
                                <p className="text-blue-100 text-xs sm:text-sm mt-0.5">Point of Sale System</p>
                            </div>
                            <div className="grid grid-cols-2 border-b text-sm font-semibold">
                                <button type="button" onClick={() => switchAuth('login')} className={'py-3.5 ' + (authMode === 'login' ? 'text-blue-700 border-b-2 border-blue-700 font-bold' : 'text-slate-400 hover:text-slate-600')}>Sign In</button>
                                <button type="button" onClick={() => switchAuth('register')} className={'py-3.5 ' + (authMode === 'register' ? 'text-blue-700 border-b-2 border-blue-700 font-bold' : 'text-slate-400 hover:text-slate-600')}>Create Account</button>
                            </div>
                            <form onSubmit={authMode === 'login' ? login : register} className="p-6 sm:p-8 space-y-4">
                                <p className="text-xs sm:text-sm text-slate-500">{authMode === 'login' ? 'Welcome back! Sign in to start selling.' : 'Register a new cashier account.'}</p>
                                {authMode === 'register' && <div><label className="block text-xs sm:text-sm font-semibold mb-1.5">Full Name</label><input required minLength={2} maxLength={120} value={fullName} onChange={e => setFullName(e.target.value)} placeholder="Juan Dela Cruz" className="w-full border rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500" /></div>}
                                <div><label className="block text-xs sm:text-sm font-semibold mb-1.5">{authMode === 'login' ? 'Cashier Username' : 'Choose a Username'}</label><input required autoComplete="username" minLength={authMode === 'register' ? 3 : undefined} maxLength={50} value={username} onChange={e => setUsername(e.target.value.trim())} placeholder="john.aquino" className="w-full border rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500" />{authMode === 'register' && <p className="text-xs text-slate-400 mt-1">3-50 characters: letters, numbers, . _ -</p>}</div>
                                <div><label className="block text-xs sm:text-sm font-semibold mb-1.5">Password</label><input required autoComplete={authMode === 'login' ? 'current-password' : 'new-password'} minLength={authMode === 'register' ? 8 : undefined} type={showPw ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)} placeholder={authMode === 'login' ? 'Your password' : 'At least 8 characters'} className="w-full border rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500" /></div>
                                {authMode === 'register' && <div><label className="block text-xs sm:text-sm font-semibold mb-1.5">Confirm Password</label><input required autoComplete="new-password" type={showPw ? 'text' : 'password'} value={confirmPw} onChange={e => setConfirmPw(e.target.value)} placeholder="Re-enter password" className="w-full border rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500" /></div>}
                                <label className="flex items-center gap-2 text-xs sm:text-sm text-slate-600 cursor-pointer pt-1"><input type="checkbox" checked={showPw} onChange={e => setShowPw(e.target.checked)} className="w-4 h-4 rounded text-blue-600" /> Show password</label>
                                {loginError && <div className="bg-red-50 text-red-600 p-3 rounded-xl text-xs sm:text-sm">{loginError}</div>}
                                <button disabled={authBusy} className="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:opacity-60 text-white font-bold py-3.5 rounded-xl shadow-lg transition">{authBusy ? 'Please wait...' : (authMode === 'login' ? 'Sign In' : 'Create Account')}</button>
                                <p className="text-center text-xs sm:text-sm text-slate-500 pt-2">{authMode === 'login'
                                    ? <>No account yet? <button type="button" onClick={() => switchAuth('register')} className="text-blue-600 font-semibold underline">Create one</button></>
                                    : <>Already registered? <button type="button" onClick={() => switchAuth('login')} className="text-blue-600 font-semibold underline">Sign in</button></>}</p>
                                <div className="px-2 pb-2 text-center text-xs sm:text-sm text-slate-500 border-t pt-4">Are you a customer? <a href="customer.html" className="text-blue-600 font-semibold underline">Open Customer Portal</a></div>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col">
                    <header className="bg-white border-b sticky top-0 z-30 shadow-xs pt-[env(safe-area-inset-top)]">
                        <div className="max-w-[1600px] mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 text-white p-2 sm:p-2.5 rounded-xl shadow-sm"><Logo className="w-5 h-5 sm:w-6 sm:h-6" /></div>
                                <div>
                                    <h1 className="font-bold text-base sm:text-lg leading-tight">La Vara's Resto</h1>
                                    <p className="text-[11px] sm:text-xs text-slate-500">Point of Sale System</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 sm:gap-4">
                                <div className="text-right hidden sm:block">
                                    <p className="font-semibold text-xs sm:text-sm">{cashier.name}</p>
                                    <p className="text-[11px] text-slate-500">Cashier</p>
                                </div>
                                <button onClick={logout} title="Sign Out" aria-label="Sign Out" className="p-2 sm:p-2.5 hover:bg-slate-100 active:bg-slate-200 text-slate-600 rounded-xl transition flex items-center gap-1.5 text-xs sm:text-sm font-semibold">
                                    <LogoutIcon className="w-5 h-5" />
                                    <span className="hidden sm:inline">Sign Out</span>
                                </button>
                            </div>
                        </div>
                        <div className="max-w-[1600px] mx-auto px-4 sm:px-6 pb-2.5 flex gap-2">
                            <button onClick={() => setPage('pos')} className={'px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ' + (page === 'pos' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100')}>POS Register</button>
                            <button onClick={() => setPage('history')} className={'px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ' + (page === 'history' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100')}>
                                Order History
                                {history.filter(h => h.status === 'Pending').length > 0 && (
                                    <span className="ml-1.5 bg-amber-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">
                                        {history.filter(h => h.status === 'Pending').length}
                                    </span>
                                )}
                            </button>
                        </div>
                    </header>

                    {page === 'history' ? (
                        <main className="max-w-[1500px] w-full mx-auto p-4 sm:p-6 flex-1">
                            <div className="bg-white rounded-2xl border overflow-hidden shadow-sm">
                                <div className="p-4 sm:p-6 border-b flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                    <div>
                                        <h2 className="text-lg sm:text-xl font-bold">Order History &amp; Online Orders</h2>
                                        <p className="text-xs sm:text-sm text-slate-500">Live orders sync automatically every 15 seconds</p>
                                    </div>
                                    <button onClick={() => { refreshOrders(); refreshProducts(); }} className="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 rounded-xl text-xs font-semibold text-slate-700 flex items-center gap-1 self-end sm:self-auto">
                                        🔄 Refresh Now
                                    </button>
                                </div>
                                {!history.length ? (
                                    <div className="p-16 text-center text-slate-400 text-sm">No orders recorded yet.</div>
                                ) : (
                                    <>
                                        {/* Mobile Order Cards View (shown on screens < 768px) */}
                                        <div className="block md:hidden divide-y">
                                            {history.map(o => (
                                                <div key={o.order_code} className="p-4 space-y-2.5">
                                                    <div className="flex justify-between items-start gap-2">
                                                        <div>
                                                            <div className="flex items-center gap-1.5">
                                                                <span className="font-bold text-sm text-slate-900">{o.order_code}</span>
                                                                <span className={'text-[10px] font-bold px-2 py-0.5 rounded-full ' + (o.order_type === 'online' ? 'bg-purple-100 text-purple-700' : 'bg-slate-100 text-slate-600')}>
                                                                    {o.order_type === 'online' ? 'Online' : 'POS'}
                                                                </span>
                                                            </div>
                                                            <p className="text-xs text-slate-500 mt-0.5">{fmtDate(o.created_at)}</p>
                                                        </div>
                                                        <span className={'text-xs font-bold px-2.5 py-1 rounded-full ' + (STATUS_BADGE[o.status] || 'bg-slate-100')}>{o.status}</span>
                                                    </div>
                                                    <div className="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl space-y-1">
                                                        <div className="flex justify-between"><span className="text-slate-400">Customer:</span><span className="font-semibold">{o.customer_name}</span></div>
                                                        <div className="flex justify-between"><span className="text-slate-400">Cashier:</span><span>{o.cashier_name}</span></div>
                                                        <div className="flex justify-between"><span className="text-slate-400">Payment:</span><span>{o.payment_method}{o.payment_reference ? ' (' + o.payment_reference + ')' : ''}</span></div>
                                                        <div className="flex justify-between pt-1 border-t"><span className="font-bold text-slate-700">Total:</span><span className="font-extrabold text-blue-600 text-sm">{money(o.total)}</span></div>
                                                    </div>
                                                    {o.order_type === 'online' && (o.status === 'Pending' || o.status === 'Processing') && (
                                                        <div className="flex gap-2 pt-1">
                                                            {o.status === 'Pending' && (
                                                                <button onClick={() => setOrderStatus(o.order_code, 'Processing')} className="flex-1 text-xs bg-blue-600 active:bg-blue-700 text-white py-2 rounded-xl font-bold">
                                                                    Process
                                                                </button>
                                                            )}
                                                            <button onClick={() => setOrderStatus(o.order_code, 'Completed')} className="flex-1 text-xs bg-green-600 active:bg-green-700 text-white py-2 rounded-xl font-bold">
                                                                Complete
                                                            </button>
                                                            <button onClick={() => { if (confirm('Cancel this order and return the stock?')) setOrderStatus(o.order_code, 'Cancelled'); }} className="text-xs bg-red-50 active:bg-red-100 text-red-600 px-3 py-2 rounded-xl font-semibold">
                                                                Cancel
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>

                                        {/* Desktop Table View (shown on md+ screens) */}
                                        <div className="hidden md:block overflow-x-auto">
                                            <table className="w-full text-sm">
                                                <thead className="bg-slate-50 text-slate-600">
                                                    <tr>
                                                        {['Order ID', 'Type', 'Customer', 'Cashier', 'Payment', 'Total', 'Status', 'Date', 'Action'].map(x => (
                                                            <th key={x} className="text-left p-4 font-semibold">{x}</th>
                                                        ))}
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y">
                                                    {history.map(o => (
                                                        <tr className="hover:bg-slate-50/70 transition" key={o.order_code}>
                                                            <td className="p-4 font-semibold">{o.order_code}</td>
                                                            <td className="p-4">
                                                                <span className={'text-xs font-bold px-2.5 py-1 rounded-full ' + (o.order_type === 'online' ? 'bg-purple-100 text-purple-700' : 'bg-slate-100 text-slate-600')}>
                                                                    {o.order_type === 'online' ? 'Online' : 'POS'}
                                                                </span>
                                                            </td>
                                                            <td className="p-4">{o.customer_name}</td>
                                                            <td className="p-4 text-slate-500">{o.cashier_name}</td>
                                                            <td className="p-4">
                                                                {o.payment_method}
                                                                {o.payment_reference && <span className="block text-xs text-slate-400">{o.payment_reference}</span>}
                                                            </td>
                                                            <td className="p-4 font-bold text-slate-900">{money(o.total)}</td>
                                                            <td className="p-4">
                                                                <span className={'text-xs font-bold px-3 py-1 rounded-full ' + (STATUS_BADGE[o.status] || 'bg-slate-100')}>
                                                                    {o.status}
                                                                </span>
                                                            </td>
                                                            <td className="p-4 text-xs text-slate-500">{fmtDate(o.created_at)}</td>
                                                            <td className="p-4 whitespace-nowrap">
                                                                {o.order_type === 'online' && (o.status === 'Pending' || o.status === 'Processing') ? (
                                                                    <div className="flex gap-2">
                                                                        {o.status === 'Pending' && (
                                                                            <button onClick={() => setOrderStatus(o.order_code, 'Processing')} className="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg font-semibold shadow-xs">
                                                                                Process
                                                                            </button>
                                                                        )}
                                                                        <button onClick={() => setOrderStatus(o.order_code, 'Completed')} className="text-xs bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg font-semibold shadow-xs">
                                                                            Complete
                                                                        </button>
                                                                        <button onClick={() => { if (confirm('Cancel this order and return the stock?')) setOrderStatus(o.order_code, 'Cancelled'); }} className="text-xs bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg font-semibold">
                                                                            Cancel
                                                                        </button>
                                                                    </div>
                                                                ) : (
                                                                    <span className="text-slate-300">-</span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </>
                                )}
                            </div>
                        </main>
                    ) : (
                        <main className="max-w-[1600px] w-full mx-auto p-4 sm:p-6 pb-24 xl:pb-6 flex-1">
                            <div className="grid grid-cols-1 xl:grid-cols-3 gap-5">
                                <section className="xl:col-span-2 bg-white rounded-2xl border p-4 sm:p-5 shadow-sm">
                                    <div className="flex flex-col sm:flex-row justify-between gap-3 mb-4">
                                        <div>
                                            <h2 className="text-lg sm:text-xl font-bold">POS Products</h2>
                                            <p className="text-xs sm:text-sm text-slate-500">Tap items to punch them into the order</p>
                                        </div>
                                        <div className="relative">
                                            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search product..." className="border rounded-xl px-4 py-2.5 text-base w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                            {search && <button onClick={() => setSearch('')} className="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">✕</button>}
                                        </div>
                                    </div>
                                    <div className="flex gap-2 overflow-x-auto pb-3 pt-1 no-scrollbar -mx-1 px-1">
                                        {cats.map(c => (
                                            <button key={c} onClick={() => setCategory(c)} className={'px-4 py-2 rounded-full text-xs sm:text-sm font-semibold whitespace-nowrap transition ' + (category === c ? 'bg-blue-600 text-white shadow-xs' : 'bg-slate-100 hover:bg-slate-200 text-slate-700')}>
                                                {c}
                                            </button>
                                        ))}
                                    </div>
                                    {!filtered.length && <div className="py-16 text-center text-slate-400 text-sm">No items found matching "{search}".</div>}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-2">
                                        {filtered.map(p => {
                                            const remaining = Number(p.stock) - qty(p.id);
                                            return (
                                                <div key={p.id} className="product-card border rounded-2xl overflow-hidden bg-white hover:shadow-md transition flex flex-col">
                                                    <div className="h-36 sm:h-40 bg-slate-100 overflow-hidden relative">
                                                        {p.image ? (
                                                            <img src={p.image} alt={p.name} loading="lazy" onError={e => { e.target.style.display = 'none'; }} className="product-image w-full h-full object-cover" />
                                                        ) : (
                                                            <div className="w-full h-full flex items-center justify-center text-4xl bg-slate-100">🍽️</div>
                                                        )}
                                                        {Number(p.stock) <= 0 && <span className="absolute top-2 right-2 bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded-md">Sold Out</span>}
                                                    </div>
                                                    <div className="p-4 flex flex-col flex-1">
                                                        <div className="flex justify-between items-center text-xs">
                                                            <span className="bg-blue-50 text-blue-600 font-semibold px-2 py-0.5 rounded-full">{p.category}</span>
                                                            <span className={Number(p.stock) <= 5 ? 'text-red-500 font-semibold' : 'text-slate-500'}>
                                                                {Number(p.stock) > 0 ? (remaining <= 0 ? 'Max in order' : 'Stock: ' + remaining) : 'Out of stock'}
                                                            </span>
                                                        </div>
                                                        <h3 className="font-bold text-sm sm:text-base mt-2 line-clamp-1">{p.name}</h3>
                                                        <p className="text-blue-600 text-base sm:text-lg font-extrabold mt-1">{money(p.price)}</p>
                                                        <div className="mt-auto pt-3">
                                                            {qty(p.id) === 0 ? (
                                                                <button disabled={Number(p.stock) <= 0} onClick={() => add(p)} className="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:bg-slate-200 disabled:text-slate-400 text-white py-2.5 rounded-xl font-semibold text-sm transition">
                                                                    {Number(p.stock) > 0 ? '+ Add Order' : 'Out of Stock'}
                                                                </button>
                                                            ) : (
                                                                <div className="flex justify-between items-center bg-slate-100 rounded-xl p-1">
                                                                    <button onClick={() => changeQty(p.id, -1)} aria-label="Decrease" className="w-9 h-9 bg-white active:bg-slate-200 rounded-lg font-bold shadow-xs">−</button>
                                                                    <b className="text-sm">{qty(p.id)}</b>
                                                                    <button disabled={remaining <= 0} onClick={() => add(p)} aria-label="Increase" className="w-9 h-9 bg-blue-600 active:bg-blue-700 text-white rounded-lg font-bold disabled:opacity-40 shadow-xs">+</button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>

                                {/* Desktop POS Order Sidebar */}
                                <aside className="hidden xl:block">
                                    <div className="bg-white rounded-2xl border sticky top-28 overflow-hidden shadow-sm">
                                        <div className="p-5 border-b flex justify-between items-center">
                                            <div>
                                                <h2 className="font-bold text-lg">Current Order</h2>
                                                <p className="text-xs text-slate-500">POS checkout details</p>
                                            </div>
                                            <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold">
                                                {cart.reduce((a, b) => a + b.quantity, 0)} Items
                                            </span>
                                        </div>
                                        <div className="p-5 border-b">
                                            <label className="text-xs font-bold text-slate-500 block mb-1">CUSTOMER NAME</label>
                                            <input value={customer} onChange={e => setCustomer(e.target.value)} placeholder="Walk-in Customer" className="w-full border rounded-xl px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                        </div>
                                        <div className="p-5 max-h-80 overflow-y-auto">
                                            {!cart.length ? (
                                                <div className="text-center py-10 text-slate-400 text-sm">No items added yet. Click dishes to add.</div>
                                            ) : (
                                                cart.map(i => (
                                                    <div key={i.id} className="border rounded-xl p-3 mb-2.5 bg-slate-50/50">
                                                        <div className="flex justify-between items-start">
                                                            <div>
                                                                <b className="text-sm">{i.name}</b>
                                                                <p className="text-xs text-slate-500">{money(i.price)} each</p>
                                                            </div>
                                                            <button onClick={() => remove(i.id)} className="text-red-500 hover:text-red-700 font-bold p-1">×</button>
                                                        </div>
                                                        <div className="flex justify-between items-center mt-2.5">
                                                            <div className="flex gap-2 items-center">
                                                                <button onClick={() => changeQty(i.id, -1)} className="w-7 h-7 bg-white border rounded-lg font-bold text-xs">−</button>
                                                                <b className="text-xs w-4 text-center">{i.quantity}</b>
                                                                <button onClick={() => add(i)} className="w-7 h-7 bg-blue-600 text-white rounded-lg font-bold text-xs">+</button>
                                                            </div>
                                                            <b className="text-sm text-slate-800">{money(i.price * i.quantity)}</b>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                        <div className="border-t p-5 space-y-3 bg-white">
                                            <div className="flex justify-between text-sm text-slate-500"><span>Subtotal</span><span>{money(subtotal)}</span></div>
                                            <div className="flex justify-between text-sm text-slate-500"><span>VAT (12%)</span><span>{money(tax)}</span></div>
                                            <div className="flex justify-between border-t pt-2"><b>Total</b><b className="text-xl text-blue-600">{money(total)}</b></div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 block mb-1">PAYMENT METHOD</label>
                                                <div className="grid grid-cols-3 gap-2">
                                                    {['Cash', 'GCash', 'Card'].map(m => (
                                                        <button key={m} onClick={() => setPayment(m)} className={'py-2 rounded-xl border text-xs font-bold transition ' + (payment === m ? 'border-blue-600 bg-blue-50 text-blue-600 shadow-xs' : 'bg-white')}>
                                                            {m}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2 pt-1">
                                                <button onClick={() => setCart([])} disabled={!cart.length} className="py-3 bg-slate-100 hover:bg-slate-200 disabled:opacity-40 rounded-xl font-semibold text-sm">Clear</button>
                                                <button disabled={!cart.length} onClick={() => setCheckoutOpen(true)} className="py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-xl font-bold disabled:bg-slate-300 text-sm shadow-md transition">
                                                    Checkout
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </aside>
                            </div>
                        </main>
                    )}

                    {/* Mobile Floating Sticky Bar for POS */}
                    {page === 'pos' && cart.length > 0 && (
                        <div className="fixed bottom-0 inset-x-0 z-40 xl:hidden bg-white/95 backdrop-blur-md border-t shadow-2xl px-4 py-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] flex items-center justify-between gap-3">
                            <button onClick={() => setMobileCartOpen(true)} className="flex-1 text-left">
                                <p className="text-xs text-slate-500 flex items-center gap-1">
                                    <span>🧾</span> <span className="font-semibold text-slate-800">{cart.reduce((a, b) => a + b.quantity, 0)} items</span>
                                    <span className="text-blue-600 underline font-semibold ml-1">Edit cart</span>
                                </p>
                                <p className="text-lg font-extrabold text-blue-600 leading-tight">{money(total)}</p>
                            </button>
                            <button onClick={() => { setMobileCartOpen(false); setCheckoutOpen(true); }} className="bg-blue-600 active:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl shadow-md text-sm sm:text-base">
                                Checkout
                            </button>
                        </div>
                    )}

                    {/* Mobile POS Cart Drawer */}
                    {mobileCartOpen && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-lg p-5 sm:p-6 space-y-4 max-h-[85vh] overflow-y-auto pb-[max(1.25rem,env(safe-area-inset-bottom))] shadow-2xl">
                                <div className="flex justify-between items-center pb-2 border-b">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xl">🧾</span>
                                        <h2 className="text-lg font-bold">Current Order ({cart.reduce((a, b) => a + b.quantity, 0)})</h2>
                                    </div>
                                    <button onClick={() => setMobileCartOpen(false)} className="text-slate-400 hover:text-slate-600 p-2 text-xl font-bold">✕</button>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-500 block mb-1">CUSTOMER NAME</label>
                                    <input value={customer} onChange={e => setCustomer(e.target.value)} placeholder="Walk-in Customer" className="w-full border rounded-xl px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                </div>
                                <div className="divide-y max-h-60 overflow-y-auto pr-1">
                                    {cart.map(i => (
                                        <div key={i.id} className="py-3 flex items-center justify-between gap-3 text-sm">
                                            <div className="flex-1 min-w-0">
                                                <p className="font-semibold text-sm truncate">{i.name}</p>
                                                <p className="text-xs text-slate-500">{money(i.price)} each</p>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => changeQty(i.id, -1)} className="w-8 h-8 rounded-lg bg-slate-100 active:bg-slate-200 font-bold text-sm">−</button>
                                                <span className="font-bold text-sm w-5 text-center">{i.quantity}</span>
                                                <button onClick={() => add(i)} className="w-8 h-8 rounded-lg bg-blue-600 active:bg-blue-700 text-white font-bold text-sm">+</button>
                                                <button onClick={() => remove(i.id)} className="w-8 h-8 text-red-500 hover:text-red-700 font-bold ml-1">✕</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="border-t pt-3 space-y-1 text-sm bg-slate-50 p-3 rounded-xl">
                                    <div className="flex justify-between text-xs text-slate-600"><span>Subtotal</span><span>{money(subtotal)}</span></div>
                                    <div className="flex justify-between text-xs text-slate-600"><span>VAT (12%)</span><span>{money(tax)}</span></div>
                                    <div className="flex justify-between text-base font-extrabold pt-1 text-slate-900"><span>Total</span><span className="text-blue-600">{money(total)}</span></div>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-500 block mb-1.5">PAYMENT METHOD</label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {['Cash', 'GCash', 'Card'].map(m => (
                                            <button key={m} onClick={() => setPayment(m)} className={'py-2.5 rounded-xl border text-xs font-bold ' + (payment === m ? 'border-blue-600 bg-blue-50 text-blue-600' : 'bg-white')}>
                                                {m}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex gap-2 pt-1">
                                    <button onClick={() => setCart([])} className="py-3 px-4 rounded-xl bg-slate-100 text-red-500 font-semibold text-xs sm:text-sm">Clear</button>
                                    <button onClick={() => { setMobileCartOpen(false); setCheckoutOpen(true); }} className="flex-1 py-3 rounded-xl bg-blue-600 active:bg-blue-700 text-white font-bold text-sm shadow-md">
                                        Proceed to Pay ({money(total)})
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Checkout & Payment Confirmation Modal */}
                    {checkoutOpen && (
                        <div className="fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
                            <div className="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md p-5 sm:p-6 space-y-4 max-h-[90vh] overflow-y-auto pb-[max(1.25rem,env(safe-area-inset-bottom))] shadow-2xl">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h2 className="text-lg sm:text-xl font-bold">Confirm Payment</h2>
                                    <button onClick={() => setCheckoutOpen(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">✕</button>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-2xl flex justify-between items-center border">
                                    <div>
                                        <p className="text-xs text-slate-500">Customer: <span className="font-semibold text-slate-700">{customer.trim() || 'Walk-in Customer'}</span></p>
                                        <p className="font-semibold text-sm">Amount Due:</p>
                                    </div>
                                    <b className="text-xl text-blue-600">{money(total)}</b>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-slate-500 block mb-1.5">PAYMENT METHOD</label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {['Cash', 'GCash', 'Card'].map(m => (
                                            <button key={m} onClick={() => setPayment(m)} className={'py-2.5 rounded-xl border text-xs font-bold ' + (payment === m ? 'border-blue-600 bg-blue-50 text-blue-600 shadow-xs' : 'bg-white')}>
                                                {m}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {payment === 'Cash' ? (
                                    <div className="space-y-3">
                                        <div>
                                            <label className="font-semibold text-xs sm:text-sm block mb-1">Cash Received</label>
                                            <input type="number" step="any" value={cash} onChange={e => setCash(e.target.value)} placeholder="0.00" className="w-full border rounded-xl px-4 py-3 text-base font-bold focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                        </div>
                                        <div className="flex gap-2">
                                            {[total, Math.ceil(total / 50) * 50, Math.ceil(total / 100) * 100, Math.ceil(total / 500) * 500, 1000].filter((v, idx, arr) => v >= total && arr.indexOf(v) === idx).slice(0, 4).map(v => (
                                                <button key={v} type="button" onClick={() => setCash(String(v))} className="flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 rounded-lg text-xs font-bold text-slate-700">
                                                    ₱{v}
                                                </button>
                                            ))}
                                        </div>
                                        <div className="flex justify-between items-center bg-green-50 text-green-800 p-3.5 rounded-xl border border-green-200">
                                            <span className="font-semibold text-sm">Change:</span>
                                            <b className="text-lg font-extrabold">{money(change)}</b>
                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <label className="font-semibold text-xs sm:text-sm block mb-1">{payment} Reference Number</label>
                                        <input value={reference} onChange={e => setReference(e.target.value)} placeholder="e.g. 1029384756" className="w-full border rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                    </div>
                                )}

                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setCheckoutOpen(false)} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 font-semibold text-xs sm:text-sm text-slate-700 rounded-xl">Cancel</button>
                                    <button onClick={checkout} disabled={loading} className="flex-1 py-3 bg-blue-600 active:bg-blue-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md transition disabled:opacity-60">
                                        {loading ? 'Saving...' : 'Confirm Payment'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Receipt Modal */}
                    {receipt && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl w-full max-w-sm p-5 sm:p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
                                <div id="printable-receipt" className="font-mono text-xs">
                                    <div className="text-center mb-4">
                                        <h2 className="font-extrabold text-base sm:text-lg">LA VARA'S RESTO</h2>
                                        <p className="text-slate-500">Tagbilaran City, Bohol</p>
                                        <p className="mt-1 font-bold text-slate-700">OFFICIAL RECEIPT</p>
                                    </div>
                                    <div className="border-y border-dashed py-2.5 space-y-1">
                                        <div className="flex justify-between"><span>Order:</span><span>{receipt.orderId}</span></div>
                                        <div className="flex justify-between"><span>Date:</span><span>{receipt.date}</span></div>
                                        <div className="flex justify-between"><span>Customer:</span><span className="font-semibold">{receipt.customerName}</span></div>
                                        <div className="flex justify-between"><span>Cashier:</span><span>{receipt.cashierName}</span></div>
                                    </div>
                                    <div className="py-3 space-y-2 border-b border-dashed">
                                        {receipt.items.map(i => (
                                            <div key={i.id} className="flex justify-between items-start">
                                                <div>
                                                    <div className="font-bold">{i.name}</div>
                                                    <div className="text-slate-500">{i.quantity} × {money(i.price)}</div>
                                                </div>
                                                <b>{money(i.lineTotal)}</b>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="py-2.5 space-y-1">
                                        <div className="flex justify-between"><span>Subtotal:</span><span>{money(receipt.subtotal)}</span></div>
                                        <div className="flex justify-between"><span>VAT (12%):</span><span>{money(receipt.tax)}</span></div>
                                        <div className="flex justify-between font-extrabold text-sm pt-1 border-t"><span>TOTAL:</span><span>{money(receipt.total)}</span></div>
                                        <div className="flex justify-between pt-1"><span>Payment:</span><span>{receipt.paymentMethod}</span></div>
                                        {receipt.paymentMethod === 'Cash' && (
                                            <>
                                                <div className="flex justify-between"><span>Cash:</span><span>{money(receipt.cashReceived)}</span></div>
                                                <div className="flex justify-between"><span>Change:</span><span className="font-bold">{money(receipt.change)}</span></div>
                                            </>
                                        )}
                                        {receipt.paymentMethod !== 'Cash' && (
                                            <div className="flex justify-between"><span>Reference:</span><span>{receipt.paymentReference}</span></div>
                                        )}
                                    </div>
                                    <div className="text-center mt-5 text-slate-500 text-[11px]">
                                        <p>Thank you for dining with us!</p>
                                        <p>Please come again.</p>
                                    </div>
                                </div>
                                <div className="space-y-2 mt-5 print-hidden">
                                    <button onClick={() => window.print()} className="w-full bg-slate-900 active:bg-slate-800 text-white py-3 rounded-xl font-bold text-sm shadow-md transition">Print Receipt</button>
                                    <button onClick={() => setReceipt(null)} className="w-full bg-blue-600 active:bg-blue-700 text-white py-3 rounded-xl font-bold text-sm shadow-md transition">New Transaction</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
