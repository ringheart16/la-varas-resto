<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Vara's Resto">
<meta name="format-detection" content="telephone=no">
<title>La Vara's Resto</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#1d4ed8,#0f172a);
  color:#0f172a;
}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{width:100%;max-width:760px;text-align:center;color:#fff}
h1{font-size:clamp(1.8rem, 5vw, 2.4rem);margin:.3rem 0;font-weight:800}
p.sub{color:#bfdbfe;margin:0 0 1.8rem;font-size:clamp(0.95rem, 3vw, 1.1rem)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
a.card{
  display:block;
  background:#fff;
  color:#0f172a;
  text-decoration:none;
  border-radius:20px;
  padding:28px 20px;
  box-shadow:0 20px 40px rgba(0,0,0,.3);
  transition:transform .15s, box-shadow .15s;
}
a.card:hover{transform:translateY(-3px);box-shadow:0 24px 48px rgba(0,0,0,.35)}
a.card:active{transform:scale(0.98)}
.logo{display:inline-flex;background:rgba(255,255,255,.12);padding:14px;border-radius:20px;margin-bottom:6px}
.icon{font-size:2.8rem}
.card h2{margin:.5rem 0 .3rem;font-size:1.35rem}
.card p{margin:0;color:#64748b;font-size:.92rem;line-height:1.4}
.btn{
  display:inline-block;
  margin-top:16px;
  background:#2563eb;
  color:#fff;
  padding:11px 22px;
  border-radius:12px;
  font-weight:700;
  font-size:0.95rem;
  width:100%;
  max-width:220px;
}
small{display:block;margin-top:24px;color:#93c5fd;font-size:0.85rem}
small a{color:#fff;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="La Vara's Resto">
      <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
      <path d="M7 2v20"/>
      <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
    </svg>
  </div>
  <h1>La Vara's Resto</h1>
  <p class="sub">Point of Sale &amp; Online Ordering</p>
  <div class="grid">
    <a class="card" href="customer.html">
      <div class="icon">🧺</div>
      <h2>Customer</h2>
      <p>Browse products, place orders, and track them in real time.</p>
      <span class="btn">Customer Portal</span>
    </a>
    <a class="card" href="cashier.html">
      <div class="icon">🧾</div>
      <h2>Cashier</h2>
      <p>Run the point of sale, punch orders, and manage online pickups.</p>
      <span class="btn">Cashier Sign In</span>
    </a>
  </div>
  <small>Database sets up automatically · <a href="check.php">System check</a></small>
</div>
</body>
</html>
