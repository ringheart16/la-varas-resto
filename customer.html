<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1d4ed8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="La Vara's Resto" />
<meta name="format-detection" content="telephone=no" />
<title>La Vara's Resto | Customer Dashboard</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body{font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,a,input,select{touch-action:manipulation}
.product-image{transition:transform .3s}.product-card:hover .product-image{transform:scale(1.04)}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
</style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const API = 'api.php';
const Logo = ({ className = "w-6 h-6" }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-label="La Vara's Resto">
    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
    <path d="M7 2v20"/>
    <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
  </svg>
);
const VAT = 0.12;
const money = n => '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = s => new Date(String(s).replace(' ', 'T')).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' });

async function call(action, payload) {
  let r;
  try {
    r = await fetch(API + '?action=' + action, {
      method: payload === undefined ? 'GET' : 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
      credentials: 'same-origin',
      body: payload === undefined ? undefined : JSON.stringify(payload),
    });
  } catch (e) {
    throw Error('Cannot reach the server. Please check your connection and try again.');
  }
  const t = await r.text();
  let d;
  try { d = JSON.parse(t); } catch (e) { throw Error('Server error. Please try again in a moment.'); }
  if (!d.success) { const err = Error(d.message || 'Request failed.'); err.status = r.status; throw err; }
  return d;
}

const STATUS_STYLE = {
  Pending: 'bg-amber-100 text-amber-700',
  Processing: 'bg-blue-100 text-blue-700',
  Completed: 'bg-green-100 text-green-700',
  Cancelled: 'bg-red-100 text-red-600',
};
const Badge = ({ status }) => <span className={'text-xs font-bold px-3 py-1 rounded-full ' + (STATUS_STYLE[status] || 'bg-slate-100')}>{status}</span>;

function AuthScreen({ onAuth }) {
  const [mode, setMode] = useState('login');
  const [f, setF] = useState({ name: '', username: '', phone: '', password: '', confirm: '' });
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const set = k => e => setF({ ...f, [k]: k === 'username' ? e.target.value.trim() : e.target.value });
  const switchMode = m => { setMode(m); setError(''); setF({ ...f, password: '', confirm: '' }); setShowPw(false); };
  const inp = 'w-full border rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500';

  const submit = async e => {
    e.preventDefault();
    setError('');
    if (mode === 'register' && f.password !== f.confirm) { setError('Passwords do not match.'); return; }
    setBusy(true);
    try {
      const d = mode === 'login'
        ? await call('customer_login', { username: f.username, password: f.password })
        : await call('customer_register', { name: f.name, username: f.username, phone: f.phone, password: f.password });
      onAuth(d.customer);
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  };

  return (
    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
      <div className="w-full max-w-md my-auto bg-white rounded-3xl shadow-2xl overflow-hidden">
        <div className="bg-blue-700 p-6 sm:p-8 text-center text-white">
          <div className="inline-flex bg-white/10 p-3 sm:p-4 rounded-2xl mb-2 sm:mb-3"><Logo className="w-8 h-8 sm:w-10 sm:h-10" /></div>
          <h1 className="text-xl sm:text-2xl font-bold">La Vara's Resto</h1>
          <p className="text-blue-100 text-xs sm:text-sm mt-0.5">Customer Portal</p>
        </div>
        <div className="grid grid-cols-2 border-b text-sm font-semibold">
          <button type="button" onClick={() => switchMode('login')} className={'py-3.5 ' + (mode === 'login' ? 'text-blue-700 border-b-2 border-blue-700 font-bold' : 'text-slate-400 hover:text-slate-600')}>Sign In</button>
          <button type="button" onClick={() => switchMode('register')} className={'py-3.5 ' + (mode === 'register' ? 'text-blue-700 border-b-2 border-blue-700 font-bold' : 'text-slate-400 hover:text-slate-600')}>Create Account</button>
        </div>
        <form onSubmit={submit} className="p-6 sm:p-8 space-y-4">
          <p className="text-xs sm:text-sm text-slate-500">{mode === 'login' ? 'Welcome back! Sign in to order from La Vara\'s.' : 'Create a customer account to start ordering.'}</p>
          {mode === 'register' && <div><label className="block text-xs sm:text-sm font-semibold mb-1.5">Full Name</label><input required minLength={2} maxLength={120} value={f.name} onChange={set('name')} placeholder="Juan Dela Cruz" className={inp} /></div>}
          <div><label className="block text-xs sm:text-sm font-semibold mb-1.5">Username</label><input required autoComplete="username" maxLength={50} minLength={mode === 'register' ? 3 : undefined} value={f.username} onChange={set('username')} placeholder="juan.delacruz" className={inp} />{mode === 'register' && <p className="text-xs text-slate-400 mt-1">3-50 characters: letters, numbers, . _ -</p>}</div>
          {mode === 'register' && <div><label className="block text-xs sm:text-sm font-semibold mb-1.5">Phone (optional)</label><input type="tel" value={f.phone} onChange={set('phone')} placeholder="09123456789" className={inp} /></div>}
          <div><label className="block text-xs sm:text-sm font-semibold mb-1.5">Password</label><input required type={showPw ? 'text' : 'password'} autoComplete={mode === 'login' ? 'current-password' : 'new-password'} minLength={mode === 'register' ? 8 : undefined} value={f.password} onChange={set('password')} placeholder={mode === 'login' ? 'Your password' : 'At least 8 characters'} className={inp} /></div>
          {mode === 'register' && <div><label className="block text-xs sm:text-sm font-semibold mb-1.5">Confirm Password</label><input required type={showPw ? 'text' : 'password'} autoComplete="new-password" value={f.confirm} onChange={set('confirm')} placeholder="Re-enter password" className={inp} /></div>}
          <label className="flex items-center gap-2 text-xs sm:text-sm text-slate-600 cursor-pointer pt-1"><input type="checkbox" checked={showPw} onChange={e => setShowPw(e.target.checked)} className="w-4 h-4 rounded text-blue-600" /> Show password</label>
          {error && <div className="bg-red-50 text-red-600 p-3 rounded-xl text-xs sm:text-sm">{error}</div>}
          <button disabled={busy} className="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:opacity-60 text-white font-bold py-3.5 rounded-xl shadow-lg transition">{busy ? 'Please wait...' : (mode === 'login' ? 'Sign In' : 'Create Account')}</button>
          <p className="text-center text-xs sm:text-sm text-slate-500 pt-2">{mode === 'login'
            ? <>No account yet? <button type="button" onClick={() => switchMode('register')} className="text-blue-600 font-semibold underline">Create one</button></>
            : <>Already registered? <button type="button" onClick={() => switchMode('login')} className="text-blue-600 font-semibold underline">Sign in</button></>}</p>
          <p className="text-center text-xs text-slate-400 border-t pt-4">Store staff? <a href="cashier.html" className="text-blue-600 font-semibold hover:underline">Cashier sign in</a></p>
        </form>
      </div>
    </div>
  );
}

function Dashboard({ customer, orders, products, goShop, goOrders }) {
  const active = orders.filter(o => o.status === 'Pending' || o.status === 'Processing');
  const done = orders.filter(o => o.status === 'Completed');
  const spent = orders.filter(o => o.status !== 'Cancelled').reduce((s, o) => s + Number(o.total), 0);
  const stats = [
    ['Total Orders', orders.length, '📦'],
    ['Active Orders', active.length, '⏳'],
    ['Completed', done.length, '✅'],
    ['Total Spent', money(spent), '💰'],
  ];
  const available = products.filter(p => Number(p.stock) > 0).length;
  return (
    <div className="space-y-5">
      <div className="bg-gradient-to-r from-blue-700 to-blue-500 text-white rounded-3xl p-5 sm:p-8 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-sm">
        <div>
          <h2 className="text-xl sm:text-2xl font-bold">Hello, {customer.name.split(' ')[0]}! 👋</h2>
          <p className="text-blue-100 text-sm mt-1">{available} products are available right now. What would you like today?</p>
        </div>
        <button onClick={goShop} className="bg-white active:bg-blue-50 text-blue-700 font-bold px-6 py-3 rounded-xl shadow-md self-start md:self-auto transition">Start Shopping</button>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        {stats.map(([label, value, icon]) => (
          <div key={label} className="bg-white rounded-2xl border p-4 sm:p-5 shadow-sm">
            <div className="text-2xl">{icon}</div>
            <p className="text-xs sm:text-sm text-slate-500 mt-2">{label}</p>
            <p className="text-lg sm:text-2xl font-extrabold truncate">{value}</p>
          </div>
        ))}
      </div>
      <div className="bg-white rounded-2xl border overflow-hidden shadow-sm">
        <div className="p-4 sm:p-5 border-b flex justify-between items-center">
          <h3 className="font-bold text-base sm:text-lg">Recent Orders</h3>
          <button onClick={goOrders} className="text-sm text-blue-600 font-semibold hover:underline">View all</button>
        </div>
        {!orders.length
          ? <div className="p-10 sm:p-12 text-center text-slate-400 text-sm">You haven't placed any orders yet.</div>
          : <div className="divide-y">{orders.slice(0, 5).map(o => (
              <div key={o.order_code} className="p-4 sm:p-5 flex flex-wrap items-center justify-between gap-3">
                <div><p className="font-semibold text-sm sm:text-base">{o.order_code}</p><p className="text-xs text-slate-500">{fmtDate(o.created_at)} · {o.items.length} item(s)</p></div>
                <div className="flex items-center gap-3"><span className="font-bold text-sm sm:text-base">{money(o.total)}</span><Badge status={o.status} /></div>
              </div>))}</div>}
      </div>
    </div>
  );
}

function Shop({ products, cart, setCart, onCheckout, onOpenCart }) {
  const [search, setSearch] = useState('');
  const [category, setCategory] = useState('All');
  const cats = useMemo(() => ['All', ...new Set(products.map(p => p.category))], [products]);
  const qty = id => (cart.find(c => c.id === id) || { quantity: 0 }).quantity;
  const filtered = products.filter(p => (category === 'All' || p.category === category) && p.name.toLowerCase().includes(search.toLowerCase()));
  const lines = cart.map(c => ({ ...c, p: products.find(p => p.id === c.id) })).filter(l => l.p);
  const subtotal = lines.reduce((s, l) => s + Number(l.p.price) * l.quantity, 0);
  const vat = Math.round(subtotal * VAT * 100) / 100;
  const total = Math.round((subtotal + vat) * 100) / 100;

  const change = (id, delta) => {
    const p = products.find(x => x.id === id);
    const next = qty(id) + delta;
    if (next > Number(p.stock)) return;
    setCart(next <= 0 ? cart.filter(c => c.id !== id) : cart.some(c => c.id === id) ? cart.map(c => c.id === id ? { ...c, quantity: next } : c) : [...cart, { id, quantity: next }]);
  };

  return (
    <div className="grid grid-cols-1 xl:grid-cols-3 gap-5 pb-24 xl:pb-6">
      <section className="xl:col-span-2 bg-white rounded-2xl border p-4 sm:p-5 shadow-sm">
        <div className="flex flex-col sm:flex-row justify-between gap-3 mb-4">
          <div><h2 className="text-lg sm:text-xl font-bold">Shop Menu</h2><p className="text-xs sm:text-sm text-slate-500">Fresh stock straight from La Vara's kitchen</p></div>
          <div className="relative">
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search dishes..." className="border rounded-xl px-4 py-2.5 text-base w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            {search && <button onClick={() => setSearch('')} className="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">✕</button>}
          </div>
        </div>
        <div className="flex gap-2 overflow-x-auto pb-3 pt-1 no-scrollbar -mx-1 px-1">
          {cats.map(c => (
            <button key={c} onClick={() => setCategory(c)} className={'px-4 py-2 rounded-full text-xs sm:text-sm font-semibold whitespace-nowrap transition ' + (category === c ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 hover:bg-slate-200 text-slate-700')}>
              {c}
            </button>
          ))}
        </div>
        {!filtered.length && <div className="py-16 text-center text-slate-400 text-sm">No dishes match your search.</div>}
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-2">
          {filtered.map(p => {
            const left = Number(p.stock) - qty(p.id);
            return (
              <div key={p.id} className="product-card border rounded-2xl overflow-hidden flex flex-col bg-white hover:shadow-md transition">
                <div className="h-36 sm:h-40 bg-slate-100 overflow-hidden relative">
                  {p.image ? (
                    <img src={p.image} alt={p.name} loading="lazy" onError={e => { e.target.style.display = 'none'; }} className="product-image w-full h-full object-cover" />
                  ) : (
                    <div className="w-full h-full flex items-center justify-center text-4xl bg-slate-100">🍽️</div>
                  )}
                  {Number(p.stock) <= 0 && <span className="absolute top-2 right-2 bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded-md">Sold Out</span>}
                </div>
                <div className="p-4 flex flex-col flex-1">
                  <div className="flex justify-between items-center text-xs">
                    <span className="bg-blue-50 text-blue-600 font-semibold px-2 py-0.5 rounded-full">{p.category}</span>
                    <span className={Number(p.stock) <= 5 ? 'text-red-500 font-semibold' : 'text-slate-500'}>{Number(p.stock) > 0 ? (left <= 0 ? 'Max in cart' : 'Stock: ' + left) : 'Out of stock'}</span>
                  </div>
                  <h3 className="font-bold text-sm sm:text-base mt-2 line-clamp-1">{p.name}</h3>
                  <p className="text-blue-600 text-base sm:text-lg font-extrabold mt-1">{money(p.price)}</p>
                  <div className="mt-auto pt-3">
                    {qty(p.id) === 0 ? (
                      <button disabled={Number(p.stock) <= 0} onClick={() => change(p.id, 1)} className="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:bg-slate-200 disabled:text-slate-400 text-white font-semibold py-2.5 rounded-xl text-sm transition">
                        {Number(p.stock) > 0 ? '+ Add to Cart' : 'Out of Stock'}
                      </button>
                    ) : (
                      <div className="flex items-center justify-between bg-slate-100 rounded-xl p-1">
                        <button onClick={() => change(p.id, -1)} aria-label="Decrease quantity" className="w-9 h-9 bg-white active:bg-slate-200 rounded-lg font-bold text-slate-700 shadow-sm">−</button>
                        <span className="font-bold text-sm">{qty(p.id)}</span>
                        <button disabled={left <= 0} onClick={() => change(p.id, 1)} aria-label="Increase quantity" className="w-9 h-9 bg-blue-600 active:bg-blue-700 text-white rounded-lg font-bold disabled:opacity-40 shadow-sm">+</button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </section>

      {/* Desktop Cart Sidebar */}
      <aside className="hidden xl:block">
        <div className="bg-white rounded-2xl border sticky top-28 overflow-hidden shadow-sm">
          <div className="p-5 border-b flex justify-between items-center">
            <h2 className="font-bold text-lg">My Cart</h2>
            {cart.length > 0 && <button onClick={() => setCart([])} className="text-xs text-red-500 hover:underline">Clear all</button>}
          </div>
          {!lines.length ? (
            <div className="p-12 text-center text-slate-400 text-sm">Your cart is empty. Tap "+ Add to Cart" on any dish.</div>
          ) : (
            <div className="p-5 space-y-4">
              <div className="divide-y max-h-80 overflow-y-auto pr-1">
                {lines.map(l => (
                  <div key={l.id} className="py-2.5 flex justify-between items-center gap-3 text-sm">
                    <div className="flex-1 min-w-0">
                      <p className="font-semibold truncate">{l.p.name}</p>
                      <p className="text-xs text-slate-500">{l.quantity} × {money(l.p.price)}</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={() => change(l.id, -1)} className="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 font-bold text-xs">−</button>
                      <span className="text-xs font-bold w-4 text-center">{l.quantity}</span>
                      <button disabled={Number(l.p.stock) <= l.quantity} onClick={() => change(l.id, 1)} className="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 font-bold text-xs disabled:opacity-30">+</button>
                    </div>
                    <p className="font-bold text-sm w-20 text-right">{money(Number(l.p.price) * l.quantity)}</p>
                  </div>
                ))}
              </div>
              <div className="border-t pt-4 space-y-1.5 text-sm">
                <div className="flex justify-between"><span className="text-slate-500">Subtotal</span><span>{money(subtotal)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">VAT (12%)</span><span>{money(vat)}</span></div>
                <div className="flex justify-between text-lg font-extrabold pt-2"><span>Total</span><span className="text-blue-600">{money(total)}</span></div>
              </div>
              <button onClick={() => onCheckout(total)} className="w-full bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-bold py-3.5 rounded-xl shadow-md transition">Proceed to Checkout</button>
            </div>
          )}
        </div>
      </aside>

      {/* Mobile Floating Sticky Cart Bar */}
      {cart.length > 0 && (
        <div className="fixed bottom-0 inset-x-0 z-40 xl:hidden bg-white/95 backdrop-blur-md border-t shadow-2xl px-4 py-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] flex items-center justify-between gap-3">
          <button onClick={onOpenCart} className="flex-1 text-left">
            <p className="text-xs text-slate-500 flex items-center gap-1">
              <span>🛒</span> <span className="font-semibold text-slate-700">{cart.reduce((s, c) => s + c.quantity, 0)} item(s)</span>
              <span className="text-blue-600 underline font-semibold ml-1">View list</span>
            </p>
            <p className="text-lg font-extrabold text-blue-600 leading-tight">{money(total)}</p>
          </button>
          <button onClick={() => onCheckout(total)} className="bg-green-600 active:bg-green-700 text-white font-bold px-6 py-3 rounded-xl shadow-md text-sm sm:text-base">
            Checkout
          </button>
        </div>
      )}
    </div>
  );
}

function Orders({ orders, onCancel }) {
  if (!orders.length) return <div className="bg-white rounded-2xl border p-12 sm:p-16 text-center text-slate-400 text-sm">You haven't placed any orders yet.</div>;
  return (
    <div className="space-y-4">
      {orders.map(o => (
        <div key={o.order_code} className="bg-white rounded-2xl border p-4 sm:p-5 shadow-sm">
          <div className="flex flex-wrap justify-between items-start gap-2">
            <div>
              <p className="font-bold text-sm sm:text-base">{o.order_code}</p>
              <p className="text-xs text-slate-500 mt-0.5">{fmtDate(o.created_at)} · {o.payment_method}{o.payment_reference ? ' (' + o.payment_reference + ')' : ''}</p>
            </div>
            <Badge status={o.status} />
          </div>
          <div className="mt-3 divide-y text-xs sm:text-sm">
            {o.items.map((i, idx) => (
              <div key={idx} className="py-2 flex justify-between">
                <span>{i.product_name} <span className="text-slate-400 font-medium">× {i.quantity}</span></span>
                <span className="font-medium">{money(i.line_total)}</span>
              </div>
            ))}
          </div>
          <div className="border-t mt-3 pt-3 flex flex-wrap justify-between items-center gap-3">
            <div className="text-xs text-slate-500">Subtotal {money(o.subtotal)} · VAT {money(o.vat)}</div>
            <div className="flex items-center gap-3">
              <span className="text-base sm:text-lg font-extrabold">{money(o.total)}</span>
              {o.status === 'Pending' && (
                <button onClick={() => onCancel(o.order_code)} className="text-xs sm:text-sm text-red-600 bg-red-50 hover:bg-red-100 active:bg-red-200 font-semibold px-3 py-1.5 rounded-lg">Cancel Order</button>
              )}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [ready, setReady] = useState(false);
  const [customer, setCustomer] = useState(null);
  const [tab, setTab] = useState('dashboard');
  const [products, setProducts] = useState([]);
  const [orders, setOrders] = useState([]);
  const [cart, setCart] = useState([]);
  const [mobileCartOpen, setMobileCartOpen] = useState(false);
  const [checkout, setCheckout] = useState(null);
  const [payment, setPayment] = useState('Cash');
  const [reference, setReference] = useState('');
  const [busy, setBusy] = useState(false);
  const [toast, setToast] = useState(null);

  const notify = (text, type = 'ok') => { setToast({ text, type }); setTimeout(() => setToast(null), 5000); };
  const loadProducts = async () => { const d = await call('products'); setProducts(d.products); };
  const loadOrders = async () => { const d = await call('customer_orders'); setOrders(d.orders); };
  const refresh = async () => { try { await Promise.all([loadProducts(), loadOrders()]); } catch (e) { if (e.status === 401) setCustomer(null); } };

  useEffect(() => {
    call('customer_me').then(d => setCustomer(d.customer)).catch(() => {}).finally(() => setReady(true));
  }, []);
  useEffect(() => {
    if (!customer) return;
    refresh();
    const t = setInterval(refresh, 15000);
    return () => clearInterval(t);
  }, [customer && customer.id]);

  const logout = async () => {
    try { await call('customer_logout', {}); } catch (e) {}
    setCustomer(null); setCart([]); setOrders([]); setTab('dashboard');
  };

  const changeQty = (id, delta) => {
    const p = products.find(x => x.id === id);
    const curr = (cart.find(c => c.id === id) || {}).quantity || 0;
    const next = curr + delta;
    if (next > Number(p.stock)) return;
    setCart(next <= 0 ? cart.filter(c => c.id !== id) : cart.map(c => c.id === id ? { ...c, quantity: next } : c));
  };

  const placeOrder = async () => {
    if (payment !== 'Cash' && !reference.trim()) { notify('Please enter your ' + payment + ' payment reference number.', 'err'); return; }
    setBusy(true);
    try {
      const d = await call('customer_checkout', { payment_method: payment, payment_reference: reference.trim(), items: cart });
      setCart([]); setCheckout(null); setReference(''); setPayment('Cash'); setMobileCartOpen(false);
      await refresh();
      setTab('orders');
      notify('Order ' + d.order.order_code + ' placed! Kitchen will start preparing it.');
    } catch (e) { notify(e.message, 'err'); await refresh(); }
    finally { setBusy(false); }
  };

  const cancelOrder = async code => {
    if (!confirm('Cancel order ' + code + '?')) return;
    try { await call('customer_cancel', { order_code: code }); await refresh(); notify('Order cancelled.'); }
    catch (e) { notify(e.message, 'err'); await refresh(); }
  };

  if (!ready) return <div className="min-h-screen flex items-center justify-center text-slate-400">Loading La Vara's Resto...</div>;
  if (!customer) return <AuthScreen onAuth={c => { setCustomer(c); setTab('dashboard'); }} />;

  const tabs = [['dashboard', 'Dashboard'], ['shop', 'Menu / Shop'], ['orders', 'My Orders']];
  const cartCount = cart.reduce((s, c) => s + c.quantity, 0);
  const cartLines = cart.map(c => ({ ...c, p: products.find(p => p.id === c.id) })).filter(l => l.p);
  const cartSubtotal = cartLines.reduce((s, l) => s + Number(l.p.price) * l.quantity, 0);
  const cartVat = Math.round(cartSubtotal * VAT * 100) / 100;
  const cartTotal = Math.round((cartSubtotal + cartVat) * 100) / 100;

  return (
    <div className="min-h-screen flex flex-col">
      <header className="bg-white border-b sticky top-0 z-30 shadow-xs pt-[env(safe-area-inset-top)]">
        <div className="max-w-[1500px] mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
          <div className="flex items-center gap-3">
            <div className="bg-blue-600 text-white p-2 sm:p-2.5 rounded-xl shadow-sm"><Logo className="w-5 h-5 sm:w-6 sm:h-6" /></div>
            <div>
              <h1 className="font-bold text-base sm:text-lg leading-tight">La Vara's Resto</h1>
              <p className="text-[11px] sm:text-xs text-slate-500">Customer Portal</p>
            </div>
          </div>
          <div className="flex items-center gap-2 sm:gap-4">
            <button onClick={() => { setTab('shop'); setMobileCartOpen(true); }} aria-label="View Cart" className="relative p-2 hover:bg-slate-100 active:bg-slate-200 rounded-xl transition">
              <span className="text-xl">🛒</span>
              {cartCount > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[11px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-xs">{cartCount}</span>}
            </button>
            <div className="text-right hidden sm:block">
              <p className="font-semibold text-xs sm:text-sm">{customer.name}</p>
              <p className="text-[11px] text-slate-500">Customer</p>
            </div>
            <button onClick={logout} className="px-3 sm:px-4 py-1.5 sm:py-2 text-xs sm:text-sm font-semibold bg-slate-100 hover:bg-slate-200 active:bg-slate-300 rounded-xl transition">Log out</button>
          </div>
        </div>
        <div className="max-w-[1500px] mx-auto px-4 sm:px-6 pb-2.5 flex gap-2 overflow-x-auto no-scrollbar">
          {tabs.map(([k, label]) => (
            <button key={k} onClick={() => setTab(k)} className={'px-3.5 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap transition ' + (tab === k ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100')}>
              {label}
            </button>
          ))}
        </div>
      </header>

      <main className="max-w-[1500px] w-full mx-auto p-4 sm:p-6 flex-1">
        {tab === 'dashboard' && <Dashboard customer={customer} orders={orders} products={products} goShop={() => setTab('shop')} goOrders={() => setTab('orders')} />}
        {tab === 'shop' && <Shop products={products} cart={cart} setCart={setCart} onCheckout={t => setCheckout(t)} onOpenCart={() => setMobileCartOpen(true)} />}
        {tab === 'orders' && <Orders orders={orders} onCancel={cancelOrder} />}
      </main>

      {/* Mobile Cart Bottom Sheet */}
      {mobileCartOpen && (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-lg p-5 sm:p-6 space-y-4 max-h-[85vh] overflow-y-auto pb-[max(1.25rem,env(safe-area-inset-bottom))] shadow-2xl">
            <div className="flex justify-between items-center pb-2 border-b">
              <div className="flex items-center gap-2">
                <span className="text-xl">🧺</span>
                <h2 className="text-lg font-bold">Your Cart ({cartCount})</h2>
              </div>
              <button onClick={() => setMobileCartOpen(false)} className="text-slate-400 hover:text-slate-600 p-2 text-xl font-bold">✕</button>
            </div>
            {!cartLines.length ? (
              <div className="py-10 text-center text-slate-400 text-sm">Your cart is empty.</div>
            ) : (
              <>
                <div className="divide-y max-h-64 overflow-y-auto pr-1">
                  {cartLines.map(l => (
                    <div key={l.id} className="py-3 flex items-center justify-between gap-3 text-sm">
                      <div className="flex-1 min-w-0">
                        <p className="font-semibold text-sm truncate">{l.p.name}</p>
                        <p className="text-xs text-slate-500">{money(l.p.price)} each</p>
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={() => changeQty(l.id, -1)} className="w-8 h-8 rounded-lg bg-slate-100 active:bg-slate-200 font-bold text-sm">−</button>
                        <span className="font-bold text-sm w-5 text-center">{l.quantity}</span>
                        <button disabled={Number(l.p.stock) <= l.quantity} onClick={() => changeQty(l.id, 1)} className="w-8 h-8 rounded-lg bg-blue-600 active:bg-blue-700 text-white font-bold text-sm disabled:opacity-30">+</button>
                      </div>
                      <p className="font-bold text-sm w-20 text-right">{money(Number(l.p.price) * l.quantity)}</p>
                    </div>
                  ))}
                </div>
                <div className="border-t pt-3 space-y-1 text-sm bg-slate-50 p-3 rounded-xl">
                  <div className="flex justify-between text-xs text-slate-600"><span>Subtotal</span><span>{money(cartSubtotal)}</span></div>
                  <div className="flex justify-between text-xs text-slate-600"><span>VAT (12%)</span><span>{money(cartVat)}</span></div>
                  <div className="flex justify-between text-base font-extrabold pt-1 text-slate-900"><span>Total</span><span className="text-blue-600">{money(cartTotal)}</span></div>
                </div>
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setCart([])} className="py-3 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-red-500 font-semibold text-xs sm:text-sm">Clear</button>
                  <button onClick={() => { setMobileCartOpen(false); setCheckout(cartTotal); }} className="flex-1 py-3 rounded-xl bg-green-600 active:bg-green-700 text-white font-bold text-sm shadow-md">
                    Checkout ({money(cartTotal)})
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* Checkout Modal */}
      {checkout !== null && (
        <div className="fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
          <div className="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md p-5 sm:p-6 space-y-4 max-h-[90vh] overflow-y-auto pb-[max(1.25rem,env(safe-area-inset-bottom))] shadow-2xl">
            <div className="flex justify-between items-center border-b pb-3">
              <h2 className="text-lg sm:text-xl font-bold">Checkout Confirmation</h2>
              <button onClick={() => setCheckout(null)} className="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">✕</button>
            </div>
            <div className="bg-slate-50 rounded-2xl p-4 space-y-2 border">
              <div className="flex justify-between text-xs text-slate-500">
                <span>Items in order:</span>
                <span>{cart.reduce((s, c) => s + c.quantity, 0)} item(s)</span>
              </div>
              <div className="flex justify-between items-center pt-1 border-t">
                <span className="font-semibold text-sm">Total to Pay (inc. VAT):</span>
                <span className="font-extrabold text-blue-600 text-xl">{money(checkout)}</span>
              </div>
            </div>
            <div>
              <label className="block text-xs sm:text-sm font-semibold mb-2">Payment Method</label>
              <div className="grid grid-cols-3 gap-2">
                {['Cash', 'GCash', 'Card'].map(m => (
                  <button key={m} onClick={() => setPayment(m)} className={'py-2.5 sm:py-3 rounded-xl border text-xs sm:text-sm font-bold transition ' + (payment === m ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white hover:bg-slate-50 text-slate-700')}>
                    {m}
                  </button>
                ))}
              </div>
              {payment === 'Cash' && <p className="text-xs text-slate-500 mt-2">💵 Pay in cash at the counter upon pickup.</p>}
            </div>
            {payment !== 'Cash' && (
              <div>
                <label className="block text-xs sm:text-sm font-semibold mb-1.5">{payment} Reference Number</label>
                <input value={reference} onChange={e => setReference(e.target.value)} placeholder="e.g. 1029384756" className="w-full border rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <p className="text-xs text-slate-400 mt-1">Please enter your {payment} transaction or reference number.</p>
              </div>
            )}
            <div className="flex gap-2 pt-2">
              <button onClick={() => setCheckout(null)} className="flex-1 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 font-semibold text-xs sm:text-sm text-slate-700">Back</button>
              <button disabled={busy} onClick={placeOrder} className="flex-1 py-3 rounded-xl bg-green-600 active:bg-green-700 disabled:opacity-60 text-white font-bold text-xs sm:text-sm shadow-md transition">
                {busy ? 'Placing...' : 'Confirm Order'}
              </button>
            </div>
          </div>
        </div>
      )}

      {toast && (
        <div className={'fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-xl shadow-xl text-white text-xs sm:text-sm max-w-[90vw] text-center font-medium animate-bounce ' + (toast.type === 'err' ? 'bg-red-600' : 'bg-green-600')}>
          {toast.text}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
